<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050505">

  <title>採寸RPG📏 by LAFFMAKER</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="app">

    <!-- トップ画面 -->
    <section class="screen" id="start-screen">
      <div class="screen-inner">

       
       <h1 class="title">
  <span class="title-saisun">採寸</span>
  <span class="title-rpg">RPG</span>
  <span class="tape">📏</span>
</h1>

        <p class="by">by LAFFMAKER</p>

        <p class="catch">
          内見で「測っとけばよかった」をなくそう。
        </p>

       <button class="main-button" type="button" id="start-button">
  ▶ 採寸の旅に出る
</button>

      </div>
    </section>
    <!-- メジャー確認画面 -->
<section class="screen hidden" id="measure-check-screen">
  <div class="screen-inner">

    <!-- メジャー所持確認 -->
    <div id="measure-question">

      <p class="quest-label">QUEST 01</p>

      <img
        class="quest-character"
        src="laffgirl_measure.png"
        alt="メジャーを持ったLAFFGIRL"
      >

      <h2 class="check-title">
        メジャーは持った？📏
      </h2>

      <p class="check-text">
        採寸の旅にメジャーは必須装備！
      </p>

      <div class="choice-buttons">

        <button class="main-button" type="button" id="measure-yes">
          持った！✨
        </button>

        <button class="sub-button" type="button" id="measure-no">
          持ってない…
        </button>

      </div>
    </div>


    <!-- メジャーを持っていなかった場合 -->
    <div class="measure-help hidden" id="measure-help">

    

      <img
        class="quest-character"
        src="laffboy_no_measure.png"
        alt="持ってないだと…？と驚くLAFFBOY"
      >

      <p class="check-text">
        不動産屋さんにメジャーを借りられるか<br>
        聞いてみよう📏
      </p>

      <button class="main-button" type="button" id="measure-borrowed">
        借りられた！✨
      </button>

    </div>

  </div>
</section>

<!-- 採寸モード選択画面 -->
<section class="screen hidden" id="mode-select-screen">
  <div class="screen-inner">

    <p class="quest-label">SELECT MODE</p>

    <h2 class="check-title">
      どこまで測る？📏
    </h2>

    <p class="check-text">
      今日の採寸スタイルを選ぼう。
    </p>

    <div class="choice-buttons">

      <button class="main-button" type="button" id="quick-mode">
        ⚔️ サクッと採寸
      </button>

      <button class="sub-button" type="button" id="full-mode">
        👑 しっかり採寸【魔王級】
      </button>

    </div>

  </div>
</section>   

  <!-- QUEST 02：玄関 -->
<section class="screen hidden" id="entrance-screen">
  <div class="screen-inner">

    <p class="quest-label">QUEST 02</p>

    <h2 class="check-title">
      玄関を攻略せよ！🚪
    </h2>

    <p class="check-text">
      大型家具・家電の最初の関門。<br>
      ここは測って帰ろう。
    </p>

    <img
      class="measure-guide"
      src="quest02_entrance.png"
      alt="玄関の有効幅と有効高さの測り方"
    >

    <div class="measure-fields">

      <label class="measure-field">
        <span>有効幅</span>
        <div class="measure-input-wrap">
          <input
            type="number"
            id="entrance-width"
            inputmode="decimal"
            placeholder="0"
          >
          <span>cm</span>
        </div>
      </label>

      <label class="measure-field">
        <span>有効高さ</span>
        <div class="measure-input-wrap">
          <input
            type="number"
            id="entrance-height"
            inputmode="decimal"
            placeholder="0"
          >
          <span>cm</span>
        </div>
      </label>

    </div>

    <button class="main-button" type="button" id="entrance-next">
      ▶ 次へ
    </button>

  </div>
</section>  
  </main>
<script>
  const startButton = document.getElementById("start-button");
  const startScreen = document.getElementById("start-screen");
  const measureCheckScreen = document.getElementById("measure-check-screen");
 const measureNo = document.getElementById("measure-no");
const measureQuestion = document.getElementById("measure-question");
const measureHelp = document.getElementById("measure-help");
  const measureYes = document.getElementById("measure-yes");
const measureBorrowed = document.getElementById("measure-borrowed");
const modeSelectScreen = document.getElementById("mode-select-screen");

  startButton.addEventListener("click", function () {
    startScreen.classList.add("hidden");
    function goToModeSelect() {
  measureCheckScreen.classList.add("hidden");
  modeSelectScreen.classList.remove("hidden");
}

measureYes.addEventListener("click", goToModeSelect);
measureBorrowed.addEventListener("click", goToModeSelect);
    measureCheckScreen.classList.remove("hidden");
  });
  measureNo.addEventListener("click", function () {
  measureQuestion.classList.add("hidden");
  measureHelp.classList.remove("hidden");
});
</script>
</body>
</html>
