<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050505">

  <title>採寸RPG📏 by LAFFMAKER</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="app">

    <!-- トップ画面 -->
    <section class="screen" id="start-screen">
      <div class="screen-inner">

       
       <h1 class="title">
  <span class="title-saisun">採寸</span>
  <span class="title-rpg">RPG</span>
  <span class="tape">📏</span>
</h1>

        <p class="by">by LAFFMAKER</p>

        <p class="catch">
          内見で「測っとけばよかった」をなくそう。
        </p>

       <button class="main-button" type="button" id="start-button">
  ▶ 採寸の旅に出る
</button>

      </div>
    </section>
    <!-- メジャー確認画面 -->
<section class="screen hidden" id="measure-check-screen">
  <div class="screen-inner">

    <p class="quest-label">QUEST 01</p>

    <h2 class="check-title">
      メジャーは持った？📏
    </h2>

    <p class="check-text">
      採寸の旅にメジャーは必須装備！
    </p>

    <div class="choice-buttons">
      <button class="main-button" type="button" id="measure-yes">
        持った！✨
      </button>

      <button class="sub-button" type="button" id="measure-no">
        持ってない…
      </button>
    </div>

  </div>
</section>

  </main>
<script>
  const startButton = document.getElementById("start-button");
  const startScreen = document.getElementById("start-screen");
  const measureCheckScreen = document.getElementById("measure-check-screen");

  startButton.addEventListener("click", function () {
    startScreen.classList.add("hidden");
    measureCheckScreen.classList.remove("hidden");
  });
</script>
</body>
</html>
